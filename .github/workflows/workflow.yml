name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy"
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: echo "Deploying to ${{ inputs.target }}"
